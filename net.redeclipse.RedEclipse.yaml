id: net.redeclipse.RedEclipse
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: redeclipse
finish-args:
  - --device=dri
  - --share=network
  - --socket=wayland
  - --filesystem=xdg-run/pipewire-0:ro
modules:
  - shared-modules/SDL2/SDL2_image.json

  - name: redeclipse
    no-autogen: true
    subdir: src
    sources:
      - type: git
        url: https://github.com/redeclipse/base.git
        commit: d3f416ba628a87ce9709e8e1eee4a93df56e3180
      - type: file
        path: redeclipse.sh
      - type: patch
        path: xdg_data_home.patch
    post-install:
      - install -Dm755 ../redeclipse.sh /app/bin/redeclipse
      - install -Dm755 ../bin/amd64/redeclipse_linux /app/share/redeclipse/client
      - cp -a ../config ../data /app/share/redeclipse
      - install -Dm644 ../src/install/nix/redeclipse_x512.png /app/share/icons/hicolor/512x512/apps/net.redeclipse.RedEclipse.png
      - install -Dm644 ../src/install/nix/redeclipse.desktop.am /app/share/applications/net.redeclipse.RedEclipse.desktop
      - desktop-file-edit --set-icon=net.redeclipse.RedEclipse --set-key=Exec --set-value=redeclipse /app/share/applications/net.redeclipse.RedEclipse.desktop
